
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>기계 배치도</title>
  <style>
    body { font-family: Arial, sans-serif; }

    .layout-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .line-section {
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px;
      background-color: #f4f4f4;
    }

    .line-section.highlight {
      background-color: yellow !important;
    }

    .line-section h3 {
      margin-top: 0;
      font-size: 16px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #aaa;
      padding: 4px;
      text-align: center;
    }

    th {
      background-color: #ddd;
    }

    .search-area, .form-area {
      text-align: center;
      margin: 10px;
    }

    input, select {
      padding: 6px;
      font-size: 14px;
      margin-right: 5px;
    }

    button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

    function renderLayout() {
  const layout = document.getElementById("layout");
  layout.innerHTML = "";

  const lineMap = {};
  for (const [barcode, info] of Object.entries(machineInfo)) {
    if (!lineMap[info.line]) lineMap[info.line] = [];
    lineMap[info.line].push({ barcode, ...info });
  }

  const sortedLines = Object.keys(lineMap).sort();

  for (const lineName of sortedLines) {
    const section = document.createElement("div");
    section.className = "line-section";
    section.setAttribute("data-line", lineName);

    const machineCount = lineMap[lineName].length;

    const title = document.createElement("h3");
    title.textContent = `[${lineName}] (총 ${machineCount}대)`;
    section.appendChild(title);

    const table = document.createElement("table");
    table.innerHTML = `
      <tr><th>구분</th><th>모델</th><th>바코드</th><th>시리얼</th></tr>
    `;

    for (const machine of lineMap[lineName]) {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${machine.name}</td>
        <td>${machine.model}</td>
        <td>${machine.barcode}</td>
        <td>${machine.serial}</td>
      `;
      table.appendChild(row);
    }

    section.appendChild(table);
    layout.appendChild(section);
  }
}

      const keyword = document.getElementById("barcodeInput").value.trim();
      const layout = document.getElementById("layout");

      if (!keyword) {
        alert("바코드를 입력하세요.");
        return;
      }

      const allSections = layout.querySelectorAll(".line-section");
      allSections.forEach(sec => sec.classList.remove("highlight"));

      const foundEntry = Object.entries(machineInfo).find(([barcode, info]) => barcode === keyword);
      if (!foundEntry) {
        alert("해당 바코드를 찾을 수 없습니다.");
        return;
      }

      const targetLine = foundEntry[1].line;
      const targetSection = layout.querySelector(`.line-section[data-line="${targetLine}"]`);
      if (targetSection) {
        targetSection.classList.add("highlight");
        targetSection.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function addMachine() {
      const barcode = document.getElementById("newBarcode").value.trim();
      const line = document.getElementById("newLine").value.trim();
      const model = document.getElementById("newModel").value.trim();

      if (!barcode || !line || !model) {
        alert("모든 항목을 입력해주세요.");
        return;
      }

      machineInfo[barcode] = { name: "장비", line, model };
      renderLayout();
    }

    function removeMachine() {
      const barcode = document.getElementById("newBarcode").value.trim();

      if (!barcode) {
        alert("삭제할 바코드를 입력하세요.");
        return;
      }

      if (machineInfo[barcode]) {
        delete machineInfo[barcode];
        renderLayout();
      } else {
        alert("해당 바코드를 찾을 수 없습니다.");
      }
    }

    renderLayout();
  </script>
</body>
</html>
