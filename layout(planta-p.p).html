    .cell {

      min-height: 120px;

      margin-bottom: 5px;
      display: block;
    }
    .machine {
      font-size: 14px;
      margin-top: 4px;
    }
    input {
      padding: 5px;
      font-size: 16px;
      margin-right: 10px;
    }
    button {
      padding: 6px 12px;
      font-size: 16px;
    }

 // 라인별 기계 목록 초기화
const lineMachineMap = {};
Object.entries(machineInfo).forEach(([code, { line }]) => {
  if (!lineMachineMap[line]) lineMachineMap[line] = [];
  lineMachineMap[line].push(code);
});

const layout = document.getElementById("layout");

// 라인 셀 생성 + Total 개수 표시
Object.keys(lineMachineMap).sort().forEach(line => {
  const count = lineMachineMap[line].length;
  const div = document.createElement("div");
  div.className = "cell";
  div.id = line;
  div.innerHTML = `<span class="label">${line} (Total: ${count})</span><div class="machine-list"></div>`;
  layout.appendChild(div);
});

// 기계 목록 출력 + 앞에 번호 붙이기
Object.entries(lineMachineMap).forEach(([line, codes]) => {
  const container = document.querySelector(`#${CSS.escape(line)} .machine-list`);
  codes.forEach((code, idx) => {
    const { name, model, serial } = machineInfo[code];
    const item = document.createElement("div");
    item.className = "machine";
    item.innerText = `${idx + 1}. ${name} ${model ?? ""} ${serial ?? ""} (${code})`;
    container.appendChild(item);
  });
});


  // 바코드 입력 시 강조 기능
  function highlightMachine() {
    const barcode = document.getElementById("barcode").value.trim();

    // 모든 셀 초기화
    document.querySelectorAll(".cell").forEach(cell => {
      cell.classList.remove("highlight");
    });

    if (machineInfo[barcode]) {
      const { line } = machineInfo[barcode];
      const target = document.getElementById(line);
      if (target) {
        target.classList.add("highlight");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    } else {
      alert("해당 바코드를 찾을 수 없습니다.");
    }
  }
</script>
